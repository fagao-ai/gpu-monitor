[package]
name = "gpu-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
nvml-wrapper = "0.10"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tokio-util = "0.7"

[profile.release]
lto = true
strip = true
